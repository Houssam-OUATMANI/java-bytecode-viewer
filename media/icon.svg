<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Rounded JetBrains-style card container -->
  <rect x="2.5" y="2.5" width="19" height="19" rx="3.5" stroke="currentColor" stroke-width="1.5" />
  
  <!-- Binary row 1: "0 1" -->
  <rect x="6" y="6.2" width="3.4" height="4.8" rx="1.7" stroke="currentColor" stroke-width="1.3" />
  <path d="M13 7.2l1.6-1v4.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Subtle JetBrains badge horizontal separator -->
  <line x1="5.5" y1="13" x2="18.5" y2="13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4" stroke-dasharray="2 1.5" />
  
  <!-- Binary row 2: "1 0" -->
  <path d="M7 16.2l1.5-1v4.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="12.5" y="15.2" width="3.4" height="4.8" rx="1.7" stroke="currentColor" stroke-width="1.3" />
  
  <!-- Accent terminal block cursor -->
  <rect x="18" y="17.2" width="1.5" height="2.8" fill="currentColor" rx="0.5" />
</svg>
